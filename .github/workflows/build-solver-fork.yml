name: Build Solver (Fork)

# Reusable, solver-agnostic build workflow for cvc5/Z3.
#
# Unlike cvc5-build.yml / z3-build.yml (which poll the production S3 build
# queue for the official upstream repos), this workflow builds one explicit
# commit from an arbitrary repo URL - typically a fork - and is designed to
# be called directly from that fork's own Actions:
#
#   jobs:
#     build:
#       uses: manchester-fme/CAST/.github/workflows/build-solver-fork.yml@feature/fork-solver-build-workflows
#       with:
#         solver: cvc5
#         repo_url: ${{ github.server_url }}/${{ github.repository }}
#         ref: ${{ github.sha }}
#       secrets: inherit
#
# See .github/fork-templates/README.md for the full setup (caller workflow
# templates + required repo secrets).
#
# It intentionally does NOT touch the shared S3 build-queue / fuzzing-schedule
# state that the production pipeline (cvc5-manager.yml, cvc5-build.yml, ...)
# relies on - those scripts hardcode solver to {cvc5, z3} and assume every
# queued commit exists in the official upstream repo. Fork builds instead
# reuse the same build/artifact-collection/upload machinery and land under a
# separate S3 prefix namespaced by the source repo owner, so they can never
# collide with or corrupt production state.

on:
  workflow_call:
    inputs:
      solver:
        description: 'Solver to build: cvc5 or z3'
        required: true
        type: string
      repo_url:
        description: 'Git URL of the (forked) solver repository to build'
        required: true
        type: string
      ref:
        description: 'Commit SHA, branch, or tag to build'
        required: true
        type: string
      coverage:
        description: 'Also produce a coverage-instrumented build'
        required: false
        type: boolean
        default: false
      storage_provider:
        description: 'Storage backend ("aws" or "r2")'
        required: false
        type: string
        default: aws
    secrets:
      AWS_BUCKET_NAME:
        required: true
      AWS_ACCOUNT_ID:
        required: false
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_REGION:
        required: false

  workflow_dispatch:
    inputs:
      solver:
        description: 'Solver to build'
        required: true
        type: choice
        options:
          - cvc5
          - z3
      repo_url:
        description: 'Git URL of the (forked) solver repository to build'
        required: true
        type: string
      ref:
        description: 'Commit SHA, branch, or tag to build'
        required: true
        type: string
      coverage:
        description: 'Also produce a coverage-instrumented build'
        required: false
        type: boolean
        default: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      solver: ${{ steps.normalize.outputs.solver }}
      owner: ${{ steps.normalize.outputs.owner }}
    steps:
      - name: Validate and normalize inputs
        id: normalize
        run: |
          SOLVER="${{ inputs.solver }}"
          if [[ "$SOLVER" != "cvc5" && "$SOLVER" != "z3" ]]; then
            echo "❌ Unsupported solver '$SOLVER' (expected 'cvc5' or 'z3')"
            exit 1
          fi
          echo "solver=$SOLVER" >> $GITHUB_OUTPUT

          # Derive an owner slug from repo_url for S3 key namespacing, e.g.
          # https://github.com/someuser/cvc5.git -> someuser
          RAW_OWNER=$(echo "${{ inputs.repo_url }}" | sed -E 's#^[a-zA-Z]+://[^/]+/##; s#^[^:]+:##; s#/[^/]+/?(\.git)?/?$##')
          OWNER=$(printf '%s' "$RAW_OWNER" | tr -c 'A-Za-z0-9._-' '-')
          if [ -z "$OWNER" ]; then
            echo "❌ Could not determine an owner slug from repo_url: ${{ inputs.repo_url }}"
            exit 1
          fi
          echo "🔧 solver=$SOLVER owner=$OWNER ref=${{ inputs.ref }}"
          echo "owner=$OWNER" >> $GITHUB_OUTPUT

  build-static:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CAST (build scripts + actions)
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main

      - name: Clone ${{ needs.validate.outputs.solver }} fork
        run: |
          SOLVER="${{ needs.validate.outputs.solver }}"
          REF="${{ inputs.ref }}"
          echo "🔨 Cloning ${{ inputs.repo_url }} @ $REF"
          if [ -d "$SOLVER" ]; then
            rm -rf "$SOLVER"
          fi
          git clone "${{ inputs.repo_url }}" "$SOLVER"
          cd "$SOLVER"
          git checkout "$REF"
          echo "Checked out commit: $(git rev-parse HEAD)"

      - name: Build ${{ needs.validate.outputs.solver }} static binary
        run: ./src/solvers/${{ needs.validate.outputs.solver }}/build.sh --static

      - name: Get commit hash
        id: get-commit
        working-directory: ${{ needs.validate.outputs.solver }}
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "${{ needs.validate.outputs.solver }} commit hash: $COMMIT_HASH"

      - name: Measure binary size
        working-directory: ${{ needs.validate.outputs.solver }}
        run: |
          if [ "${{ needs.validate.outputs.solver }}" = "cvc5" ]; then
            BIN_PATH="./build/bin/cvc5"
          else
            BIN_PATH="./build/z3"
          fi
          if [ -f "$BIN_PATH" ]; then
            BINARY_SIZE=$(du -h "$BIN_PATH" | cut -f1)
            echo "Binary size: $BINARY_SIZE"
          else
            echo "ERROR: Binary not found at $BIN_PATH"
            exit 1
          fi

      - name: Collect build artifacts (headers, binary, compile_commands)
        run: |
          ./src/solvers/${{ needs.validate.outputs.solver }}/collect_build_artifacts.sh \
            ${{ needs.validate.outputs.solver }}/build .artifacts

      - name: Compress collected artifacts
        run: |
          cd .artifacts
          tar -czf ../${{ needs.validate.outputs.solver }}/build/artifacts.tar.gz .
          cd ..
          COMPRESSED_SIZE=$(du -h ${{ needs.validate.outputs.solver }}/build/artifacts.tar.gz | cut -f1)
          echo "Compressed size: $COMPRESSED_SIZE"

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ inputs.storage_provider }}

      - name: Upload fork binary to S3
        uses: ./.github/actions/s3-put-object
        with:
          key: solvers/${{ needs.validate.outputs.solver }}/builds/v2/fork/${{ needs.validate.outputs.owner }}/production/${{ steps.get-commit.outputs.commit_hash }}.tar.gz
          file: ${{ needs.validate.outputs.solver }}/build/artifacts.tar.gz

  build-static-coverage:
    needs: validate
    if: inputs.coverage == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CAST (build scripts + actions)
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main

      - name: Install LLVM/Clang 17
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '17'

      - name: Add LLVM to PATH
        run: echo "${{ env.LLVM_PATH }}/bin" >> $GITHUB_PATH

      - name: Clone ${{ needs.validate.outputs.solver }} fork
        run: |
          SOLVER="${{ needs.validate.outputs.solver }}"
          REF="${{ inputs.ref }}"
          echo "🔨 Cloning ${{ inputs.repo_url }} @ $REF"
          if [ -d "$SOLVER" ]; then
            rm -rf "$SOLVER"
          fi
          git clone "${{ inputs.repo_url }}" "$SOLVER"
          cd "$SOLVER"
          git checkout "$REF"
          echo "Checked out commit: $(git rev-parse HEAD)"

      - name: Build ${{ needs.validate.outputs.solver }} static binary with coverage
        run: |
          # Use clang with GCC toolchain to generate clang-compatible compile_commands.json
          # while still producing GCC-format coverage data (needed for fastcov)
          export CXX="clang++ --gcc-toolchain=/usr"
          export CC="clang --gcc-toolchain=/usr"
          ./src/solvers/${{ needs.validate.outputs.solver }}/build.sh --static --coverage

      - name: Get commit hash
        id: get-commit
        working-directory: ${{ needs.validate.outputs.solver }}
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "${{ needs.validate.outputs.solver }} commit hash: $COMMIT_HASH"

      - name: Measure binary size
        working-directory: ${{ needs.validate.outputs.solver }}
        run: |
          if [ "${{ needs.validate.outputs.solver }}" = "cvc5" ]; then
            BIN_PATH="./build/bin/cvc5"
          else
            BIN_PATH="./build/z3"
          fi
          if [ -f "$BIN_PATH" ]; then
            BINARY_SIZE=$(du -h "$BIN_PATH" | cut -f1)
            echo "Binary size: $BINARY_SIZE"
          else
            echo "ERROR: Binary not found at $BIN_PATH"
            exit 1
          fi

      - name: Collect build artifacts (headers, binary, compile_commands)
        run: |
          ./src/solvers/${{ needs.validate.outputs.solver }}/collect_build_artifacts.sh \
            ${{ needs.validate.outputs.solver }}/build .artifacts

      - name: Compress collected artifacts
        run: |
          cd .artifacts
          tar -czf ../${{ needs.validate.outputs.solver }}/build/artifacts.tar.gz .
          cd ..
          COMPRESSED_SIZE=$(du -h ${{ needs.validate.outputs.solver }}/build/artifacts.tar.gz | cut -f1)
          echo "Compressed size: $COMPRESSED_SIZE"

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ inputs.storage_provider }}

      - name: Upload fork coverage binary to S3
        uses: ./.github/actions/s3-put-object
        with:
          key: solvers/${{ needs.validate.outputs.solver }}/builds/v2/fork/${{ needs.validate.outputs.owner }}/coverage/${{ steps.get-commit.outputs.commit_hash }}.tar.gz
          file: ${{ needs.validate.outputs.solver }}/build/artifacts.tar.gz
