name: CI

# Basic sanity checks for CAST's own code - no test suite exists yet
# outside of src/triage (see the test-triage job below), so this catches
# the class of mistakes that would otherwise only surface at actual
# workflow-run time: invalid workflow/JSON syntax, Python that doesn't
# even parse, shell scripts with a syntax error.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install pyyaml

      - name: Validate workflow YAML
        run: |
          fail=0
          for f in .github/workflows/*.yml; do
            python3 -c "import yaml; yaml.safe_load(open('$f'))" \
              && echo "✅ $f" \
              || { echo "❌ $f"; fail=1; }
          done
          exit $fail

      - name: Validate JSON files
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            python3 -c "import json; json.load(open('$f'))" \
              && echo "✅ $f" \
              || { echo "❌ $f"; fail=1; }
          done < <(find . -name "*.json" -not -path "./.git/*" -print0)
          exit $fail

      - name: Compile-check Python
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            python3 -m py_compile "$f" \
              && echo "✅ $f" \
              || { echo "❌ $f"; fail=1; }
          done < <(find src -name "*.py" -print0)
          exit $fail

      - name: Syntax-check shell scripts
        run: |
          fail=0
          while IFS= read -r -d '' f; do
            bash -n "$f" \
              && echo "✅ $f" \
              || { echo "❌ $f"; fail=1; }
          done < <(find . -name "*.sh" -not -path "./.git/*" -print0)
          exit $fail

  test-triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # best-effort: src/triage's real-solver tests skip themselves if
      # these aren't on PATH, so a failed/unavailable install doesn't fail
      # the job -- it just narrows what the suite covers.
      - name: Install cvc5 (best effort)
        run: sudo apt-get update && sudo apt-get install -y cvc5 || true

      # Ubuntu's apt-packaged z3 is a much older 4.8.12 that doesn't
      # reproduce the bugs in src/triage/tests/fixtures/, so pull a real,
      # recent build straight from Z3Prover's own GitHub releases instead
      # (there is no upstream z3-4.17.0 -- 4.16.0 is the latest pre-5.0.0
      # release, and it reproduces the fixtures fine; the previous source
      # here, manchester-fme/CAST_triage, doesn't exist -- see #63). The
      # glibc-2.39 build matches ubuntu-latest, and its `bin/z3` is
      # self-contained (no separate libz3.so to extract -- verified with
      # ldd, it only links standard system libs).
      - name: Install z3 4.16.0 (best effort)
        run: |
          curl -fsSL -o z3.zip "https://github.com/Z3Prover/z3/releases/download/z3-4.16.0/z3-4.16.0-x64-glibc-2.39.zip" || true
          if [ -s z3.zip ] && unzip -l z3.zip >/dev/null 2>&1; then
            mkdir -p "$RUNNER_TEMP/z3-bin"
            unzip -q -j z3.zip "*/bin/z3" -d "$RUNNER_TEMP/z3-bin"
            chmod +x "$RUNNER_TEMP/z3-bin/z3"
            echo "$RUNNER_TEMP/z3-bin" >> "$GITHUB_PATH"
          else
            echo "z3 4.16.0 download unavailable or invalid -- skipping (real-z3 tests self-skip via shutil.which)"
          fi

      - name: Run src/triage's test suite
        run: python3 -m unittest discover -s src/triage/tests -v
