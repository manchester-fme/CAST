name: Triage

# Reusable: dedup/reduce/report the bug archives commit-fuzzer.yml uploads.
#
# Runnable standalone (workflow_dispatch, Actions -> Triage -> Run workflow)
# or as a step in a solver's cast.yml cycle (workflow_call, after build+fuzz
# -- see example/.github/workflows/cast.yml). archive/commit_hash are
# optional in both cases: leave empty to auto-discover the most recently
# uploaded bug archive and production build for `solver` from S3/R2 (the
# same state build.yml/commit-fuzzer.yml write to), or supply them
# explicitly to triage one specific archive/commit (e.g. the two fixture
# archives in src/triage/tests/fixtures/archives/).
#
# The target solver is always fetched as the actual binary build.yml built
# for the resolved commit (same S3/R2 key), not some unrelated pinned
# version -- see the "Fetch the target build" step. The oracle solver is
# installed the exact same way commit-fuzzer.yml's "Install oracle fallback"
# step does it during real fuzzing runs: read fuzzer.oracle_solver /
# oracle_fetch_fallback from the target solver's own manifest.json (pip /
# script / github_release) -- see "Install oracle solver" below -- so
# triage always reproduces against the same oracle build/version fuzzing
# actually used, never an unrelated pinned or apt-packaged one.

on:
  workflow_call:
    inputs:
      solver:
        description: "Solver name (namespaces the S3/R2 lookups, e.g. 'z3')"
        type: string
        required: true
      repo_url:
        description: "Git URL to clone the target solver from, to read its manifest.json (fuzzer.oracle_solver / oracle_fetch_fallback) -- the same manifest build.yml/commit-fuzzer.yml read, so the oracle installed here matches what fuzzing used"
        type: string
        required: true
      solver_dir:
        description: "Directory containing manifest.json for this solver. Defaults to src/solvers/<solver> (CAST-maintained solvers); e.g. '<solver>/.cast' for solvers whose own fork carries the manifest (see example/.github/workflows/cast.yml)"
        type: string
        required: false
        default: ""
      archive:
        description: "Repo-relative path to a specific bug archive, or empty to auto-discover the latest uploaded one"
        type: string
        required: false
        default: ""
      commit_hash:
        description: "Full commit hash to fetch as the target build, or empty to auto-discover the latest production build"
        type: string
        required: false
        default: ""
      target_cmd:
        description: "Target solver command (must invoke the 'solver' binary above, e.g. 'z3 model_validate=true')"
        type: string
        required: true
      oracle_cmd:
        description: "Oracle solver command"
        type: string
        required: true
      post:
        description: "Actually file GitHub issues (default: dry run, prints drafts only)"
        type: boolean
        required: false
        default: false
      repo:
        description: "File issues on this repo (owner/name) instead of the caller (e.g. manchester-fme/z3 when called from z3's own cast.yml); empty defaults to the caller"
        type: string
        required: false
        default: ""
  workflow_dispatch:
    inputs:
      solver:
        description: "Solver name (namespaces the S3/R2 lookups)"
        type: choice
        options: [z3, cvc5]
        default: z3
      repo_url:
        description: "Git URL to clone the target solver from, to read its manifest.json (fuzzer.oracle_solver / oracle_fetch_fallback)"
        type: string
        default: ""
      solver_dir:
        description: "Directory containing manifest.json for this solver. Defaults to src/solvers/<solver>; e.g. '<solver>/.cast' for solvers whose own fork carries the manifest"
        type: string
        default: ""
      archive:
        description: "Repo-relative path to a specific bug archive (e.g. src/triage/tests/fixtures/archives/manchester-fme_z3_solvers_z3_bugs_bugs-9167020-1786525852.tar.gz), or empty to auto-discover the latest uploaded one"
        type: string
        default: ""
      commit_hash:
        description: "Full commit hash to fetch as the target build, or empty to auto-discover the latest production build"
        type: string
        default: ""
      target_cmd:
        description: "Target solver command"
        type: string
        default: "z3 model_validate=true"
      oracle_cmd:
        description: "Oracle solver command"
        type: string
        default: "cvc5 --check-models --check-proofs"
      post:
        description: "Actually file GitHub issues (default: dry run, prints drafts only)"
        type: boolean
        default: false
      repo:
        description: "File issues on this repo (owner/name) instead of the current repo; empty defaults to manchester-fme/CAST"
        type: string
        default: ""

permissions:
  contents: read
  issues: write
  # needed to exchange this job's OIDC token for R2 access via the broker
  # Lambda, both for auto-discovery and for fetching the target build
  id-token: write

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          repository: manchester-fme/CAST
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install creduce
        run: sudo apt-get update && sudo apt-get install -y creduce

      # Shallow clone -- only needs to reach manifest.json, not a buildable
      # source tree (mirrors commit-fuzzer.yml's "Clone oracle solver repo
      # early if oracle_solver_dir needs it" step).
      - name: Clone target solver repo for its manifest.json
        run: |
          SOLVER="${{ inputs.solver }}"
          if [ ! -d "$SOLVER" ]; then
            git clone --depth 1 "${{ inputs.repo_url }}" "$SOLVER"
          fi

      # Verbatim copy of commit-fuzzer.yml's "Install oracle fallback if
      # unavailable" body -- this is the exact install path real fuzzing
      # runs take for the oracle (oracle_solver_dir is never set in
      # example/.github/workflows/cast.yml, so the manifest-declared
      # fallback below, not a CAST-tracked commit build, is always what
      # fuzzing actually ran against). Keep these two in sync.
      - name: Install oracle solver (same manifest-declared fallback commit-fuzzer.yml uses)
        id: install-oracle
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          ORACLE_SOLVER=$(jq -r '.fuzzer.oracle_solver // empty' "$MANIFEST")
          if [ -z "$ORACLE_SOLVER" ]; then
            echo "::error::no fuzzer.oracle_solver declared in $MANIFEST"
            exit 1
          fi
          echo "oracle_solver=$ORACLE_SOLVER" >> "$GITHUB_OUTPUT"
          FALLBACK_TYPE=$(jq -r '.fuzzer.oracle_fetch_fallback.type' "$MANIFEST")
          echo "Installing oracle $ORACLE_SOLVER via manifest-declared fallback ($FALLBACK_TYPE)"
          if [ "$FALLBACK_TYPE" = "pip" ]; then
            PACKAGE=$(jq -r '.fuzzer.oracle_fetch_fallback.package' "$MANIFEST")
            pip install "$PACKAGE"
          elif [ "$FALLBACK_TYPE" = "script" ]; then
            SCRIPT=$(jq -r '.fuzzer.oracle_fetch_fallback.path' "$MANIFEST")
            pip install requests
            mkdir -p "$GITHUB_WORKSPACE/oracle-bin"
            python3 "$SCRIPT" "$GITHUB_WORKSPACE/oracle-bin"
            echo "$GITHUB_WORKSPACE/oracle-bin" >> "$GITHUB_PATH"
          elif [ "$FALLBACK_TYPE" = "github_release" ]; then
            REPO=$(jq -r '.fuzzer.oracle_fetch_fallback.repo' "$MANIFEST")
            ASSET_KEYWORDS=$(jq -r '.fuzzer.oracle_fetch_fallback.asset_keywords | join(",")' "$MANIFEST")
            BINARY_NAME=$(jq -r '.fuzzer.oracle_fetch_fallback.binary_name' "$MANIFEST")
            pip install requests
            mkdir -p "$GITHUB_WORKSPACE/oracle-bin"
            python3 "$GITHUB_WORKSPACE/src/util/download_github_release_binary.py" \
              --repo "$REPO" --asset-keywords "$ASSET_KEYWORDS" --binary-name "$BINARY_NAME" \
              "$GITHUB_WORKSPACE/oracle-bin"
            echo "$GITHUB_WORKSPACE/oracle-bin" >> "$GITHUB_PATH"
          else
            echo "::error::Unsupported fuzzer.oracle_fetch_fallback.type: $FALLBACK_TYPE"
            exit 1
          fi

      - name: Install python deps for storage access
        run: pip install boto3 requests

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}
          r2_broker_function_url: 'https://e7gghvi6g5gw4gaszvu5wrou6i0annob.lambda-url.eu-north-1.on.aws/'  # see src/infra/r2-broker/README.md
          r2_broker_role_arn: 'arn:aws:iam::615930035042:role/service-role/cast-r2-broker-role-ro68mail'  # see src/infra/r2-broker/README.md
          r2_broker_region: 'eu-north-1'  # see src/infra/r2-broker/README.md

      # Builds are namespaced by whichever repo's own Actions run produced
      # them -- the solver's own fork, e.g. manchester-fme/z3 (see
      # build.yml's "Compute S3 upload key" / commit-fuzzer.yml's "Upload
      # bugs to S3" steps). manchester-fme/<solver> is that fork by
      # convention for every solver CAST currently tracks.
      #
      # NOTE: untested end-to-end here (no local access to the org's R2/AWS
      # credentials) -- verify on a real run and adjust if the broker
      # rejects the namespace/key.
      - name: Resolve archive/commit_hash (auto-discover if not given)
        id: resolve
        env:
          SOLVER: ${{ inputs.solver }}
          NAMESPACE: manchester-fme/${{ inputs.solver }}
          GIVEN_ARCHIVE: ${{ inputs.archive }}
          GIVEN_COMMIT: ${{ inputs.commit_hash }}
        run: |
          python3 <<'PYEOF'
          import os, sys
          sys.path.insert(0, "src")
          from scheduling.s3_state import get_state_manager

          solver = os.environ["SOLVER"]
          namespace = os.environ["NAMESPACE"]
          given_archive = os.environ.get("GIVEN_ARCHIVE", "")
          given_commit = os.environ.get("GIVEN_COMMIT", "")

          manager = get_state_manager(solver, namespace=namespace)

          if given_commit:
              commit_hash = given_commit
          else:
              commit_hash = manager.get_latest_available_build()
              if not commit_hash:
                  print(f"::error::no production build found for {solver} under {namespace}")
                  sys.exit(1)
              print(f"auto-discovered commit: {commit_hash}")

          if given_archive:
              archive_path = given_archive
          else:
              prefix = f"{namespace}/solvers/{solver}/bugs/"
              paginator = manager.s3_client.get_paginator("list_objects_v2")
              latest_key, latest_time = None, None
              for page in paginator.paginate(Bucket=manager.bucket, Prefix=prefix):
                  for obj in page.get("Contents", []):
                      if latest_time is None or obj["LastModified"] > latest_time:
                          latest_time, latest_key = obj["LastModified"], obj["Key"]
              if not latest_key:
                  # Not an error: fuzzing finding zero bugs this cycle is the
                  # normal, common outcome, not a failure - nothing to triage,
                  # so skip the rest of the pipeline (see the archive_found
                  # guards below) rather than failing the whole cast.yml run.
                  print(f"ℹ️  no bug archive found for {solver} under {prefix} - nothing to triage this run")
                  with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                      f.write("archive_found=false\n")
                  sys.exit(0)
              print(f"auto-discovered archive: {latest_key}")
              resp = manager.s3_client.get_object(Bucket=manager.bucket, Key=latest_key)
              with open("bugs.tar.gz", "wb") as f:
                  f.write(resp["Body"].read())
              archive_path = "bugs.tar.gz"

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("archive_found=true\n")
              f.write(f"archive={archive_path}\n")
              f.write(f"commit_hash={commit_hash}\n")
          PYEOF

      - name: Fetch the ${{ inputs.solver }} build CAST produced for this commit
        if: steps.resolve.outputs.archive_found == 'true'
        run: |
          SOLVER="${{ inputs.solver }}"
          NAMESPACE="manchester-fme/$SOLVER"
          KEY="$NAMESPACE/solvers/$SOLVER/builds/v2/production/${{ steps.resolve.outputs.commit_hash }}.tar.gz"
          echo "Fetching $KEY"
          if [ "${AWS_STORAGE_PROVIDER:-}" = "r2-broker" ]; then
            src/util/r2_broker_cli.sh get "$NAMESPACE" "$KEY" artifacts.tar.gz
          else
            aws s3api get-object --bucket "$AWS_BUCKET_NAME" --key "$KEY" artifacts.tar.gz
          fi
          # collect_build_artifacts.sh always packs the binary at bin/<solver>
          # inside the archive, regardless of solver -- see that script.
          # Extract the whole archive rather than naming "bin/$SOLVER" as the
          # member to extract: build.yml's "Compress collected artifacts"
          # step runs `tar -czf ... .` from inside .artifacts/, which GNU tar
          # stores with a leading "./" on every member (e.g. "./bin/cvc5") --
          # asking tar to extract the exact name "bin/$SOLVER" never matches
          # that and always fails with "Not found in archive", regardless of
          # commit. A full extraction sidesteps the leading-"./" mismatch
          # entirely (verified locally: reproduces the exact failure with a
          # named member, succeeds with a full extract).
          mkdir -p "$RUNNER_TEMP/target-bin"
          tar -xzf artifacts.tar.gz -C "$RUNNER_TEMP/target-bin"
          mv "$RUNNER_TEMP/target-bin/bin/$SOLVER" "$RUNNER_TEMP/target-bin/$SOLVER"
          chmod +x "$RUNNER_TEMP/target-bin/$SOLVER"
          echo "$RUNNER_TEMP/target-bin" >> "$GITHUB_PATH"

      - name: Print solver versions
        if: steps.resolve.outputs.archive_found == 'true'
        run: |
          "${{ inputs.solver }}" --version
          "${{ steps.install-oracle.outputs.oracle_solver }}" --version

      # GH_TOKEN authenticates `gh issue create` when --post is set (see
      # report.py); unused, and gh is never invoked, on a dry run.
      #
      # --repo defaults to the calling repo (github.repository correctly
      # resolves to e.g. manchester-fme/z3, not manchester-fme/CAST, when
      # this workflow is called via workflow_call from z3's own cast.yml)
      # rather than wherever `gh` would otherwise infer from this job's
      # checkout of manchester-fme/CAST above -- issues belong on the
      # fork that actually found the bug, not on CAST itself.
      - name: Run triage pipeline (dedup -> reduce -> dedup -> report)
        if: steps.resolve.outputs.archive_found == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 src/triage/triage.py "${{ steps.resolve.outputs.archive }}" \
            --target-cmd "${{ inputs.target_cmd }}" \
            --oracle-cmd "${{ inputs.oracle_cmd }}" \
            --out-dir triage_out \
            --repo "${{ inputs.repo || github.repository }}" \
            ${{ inputs.post && '--post' || '' }}

      - name: Upload dedup_out/reduced_out for inspection
        if: always() && steps.resolve.outputs.archive_found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: triage-out
          path: triage_out/
          if-no-files-found: ignore

      - name: Nothing to triage
        if: steps.resolve.outputs.archive_found == 'false'
        run: echo "No bug archive found this run - fuzzing found nothing to triage."
