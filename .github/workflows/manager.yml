name: Manager

# Reusable, solver-agnostic commit manager workflow.
#
# Checks the upstream solver repo for new commits, filters them for C++
# changes, and updates the shared S3 build-queue/fuzzing-schedule state for a
# given solver (or, given a manual commit_hash, validates and enqueues just
# that commit). It generalizes the logic duplicated between cvc5-manager.yml
# and z3-manager.yml behind a single set of parameters (solver, repo_url).
#
# Runnable standalone - no other workflow file is required to trigger it:
#   - From the GitHub UI/API: Actions -> Manager -> Run workflow, or
#     `gh workflow run manager.yml -f solver=z3 -f
#     repo_url=https://github.com/Z3Prover/z3.git`
#   - From another workflow: uses: ./.github/workflows/manager.yml (workflow_call)
#
# solver/repo_url are required - deliberately no default (see namespacing
# note below: state is namespaced per solver, so silently defaulting to any
# one solver risks misattributing another caller's state to it).
#
# State is always namespaced by the calling repository (`github.repository`,
# e.g. `manchester-fme/CAST` or `someuser/cvc5`) - not just for forks, for
# every caller, including CAST's own runs. There is no unnamespaced/"default"
# state and nothing to configure: `github.repository` comes from the Actions
# runtime itself, not a workflow input, so it can't be forgotten or spoofed.
# The namespace is the top-level prefix in the bucket (e.g.
# `manchester-fme/CAST/solvers/cvc5/fuzzing-state/...`), so every caller gets
# its own directory and a fork's state can never collide with another
# caller's - not whatever bare/unnamespaced path an older direct caller
# (e.g. cvc5-manager.yml) might use.
#
# Calling from a fork is just:
#
#   jobs:
#     cast-fuzz:
#       uses: manchester-fme/CAST/.github/workflows/manager.yml@main
#       with:
#         solver: cvc5
#         repo_url: ${{ github.server_url }}/${{ github.repository }}
#       secrets: inherit

on:
  workflow_call:
    inputs:
      solver:
        description: 'Solver name (namespaces the build queue/fuzzing schedule state)'
        required: true
        type: string
      repo_url:
        description: 'Git URL of the upstream solver repository to monitor'
        required: true
        type: string
      commit_hash:
        description: 'Optional: commit hash to add to build queue (skips the scheduled scan)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      solver:
        description: 'Solver name (namespaces the build queue/fuzzing schedule state)'
        required: true
        type: string
      repo_url:
        description: 'Git URL of the upstream solver repository to monitor'
        required: true
        type: string
      commit_hash:
        description: 'Optional: commit hash to add to build queue (skips the scheduled scan)'
        required: false
        type: string

jobs:
  manager:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install boto3 GitPython requests

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}
          r2_broker_function_url: 'https://e7gghvi6g5gw4gaszvu5wrou6i0annob.lambda-url.eu-north-1.on.aws/'  # see src/infra/r2-broker/README.md
          r2_broker_role_arn: 'arn:aws:iam::615930035042:role/service-role/cast-r2-broker-role-ro68mail'  # see src/infra/r2-broker/README.md
          r2_broker_region: 'eu-north-1'  # see src/infra/r2-broker/README.md

      - name: Run manager
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SOLVER="${{ inputs.solver }}"
          REPO_URL="${{ inputs.repo_url }}"
          NAMESPACE="${{ github.repository }}"
          NAMESPACE_ARGS=(--namespace "$NAMESPACE")
          if [ -n "${{ inputs.commit_hash }}" ]; then
            # Manual trigger: check for C++ changes before adding to build queue
            COMMIT_HASH="${{ inputs.commit_hash }}"
            if python3 src/scheduling/detect_cpp_changes.py "$REPO_URL" "$COMMIT_HASH" --token $GITHUB_TOKEN; then
              echo "✅ Commit $COMMIT_HASH has C++ changes, adding to build queue and fuzzing schedule"
              python3 src/scheduling/s3_state.py "$SOLVER" "${NAMESPACE_ARGS[@]}" build-queue add "$COMMIT_HASH"
              python3 src/scheduling/s3_state.py "$SOLVER" "${NAMESPACE_ARGS[@]}" fuzzing-schedule add "$COMMIT_HASH"
            else
              echo "❌ Commit $COMMIT_HASH has no C++ changes, skipping"
              exit 1
            fi
          else
            # Scheduled run: check commits and update queues
            python3 src/scheduling/manager.py "$SOLVER" "$REPO_URL" --token $GITHUB_TOKEN "${NAMESPACE_ARGS[@]}"
          fi
