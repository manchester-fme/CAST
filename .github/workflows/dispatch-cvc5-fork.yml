name: Dispatch cvc5 fork

on:
  schedule:
    - cron: '*/15 * * * *'
    - cron: '5,35 * * * *'
    - cron: '0 0 * * *'
    - cron: '0 0 1 * *'
    - cron: '45 0,6,12,18 * * *'
  workflow_dispatch:
    inputs:
      action:
        required: true
        type: choice
        options:
          - manager
          - build
          - coverage
          - daily-check
          - fuzz

jobs:
  manager:
    if: inputs.action == 'manager' || github.event.schedule == '*/15 * * * *'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.CVC5_FORK_DISPATCH_TOKEN }}
        run: gh workflow run cast.yml --repo manchester-fme/cvc5 --ref main -f action=manager

  build:
    if: inputs.action == 'build' || github.event.schedule == '5,35 * * * *'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.CVC5_FORK_DISPATCH_TOKEN }}
        run: gh workflow run cast.yml --repo manchester-fme/cvc5 --ref main -f action=build

  coverage:
    if: inputs.action == 'coverage' || github.event.schedule == '0 0 1 * *'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.CVC5_FORK_DISPATCH_TOKEN }}
        run: gh workflow run cast.yml --repo manchester-fme/cvc5 --ref main -f action=coverage

  daily-check:
    if: inputs.action == 'daily-check' || github.event.schedule == '0 0 * * *'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.CVC5_FORK_DISPATCH_TOKEN }}
        run: gh workflow run cast.yml --repo manchester-fme/cvc5 --ref main -f action=daily-check

  fuzz:
    if: inputs.action == 'fuzz' || github.event.schedule == '45 0,6,12,18 * * *'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ secrets.CVC5_FORK_DISPATCH_TOKEN }}
        run: gh workflow run cast.yml --repo manchester-fme/cvc5 --ref main -f action=fuzz
