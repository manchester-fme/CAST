name: Coverage Mapper

# Reusable, solver-agnostic coverage-mapping workflow.
#
# Generalizes cvc5-coverage-mapper.yml and z3-coverage-mapper.yml behind a
# single set of parameters (solver, repo_url, commit_hash). The coverage
# engine itself (src/coverage/{coverage_mapper,generate_matrix,count_tests}.py)
# is CAST-owned and fully solver-agnostic in code - it never branches on
# `inputs.solver`. What genuinely differs between cvc5 (ctest introspection)
# and z3 (SMT2 file walk + cvc5-oracle diff) is pushed entirely into that
# solver's src/solvers/<solver>/manifest.json ("coverage" section): two
# opaque shell commands, `list_tests_command` (stdout = one test per line)
# and `run_test_command` (a `{test}`-templated command; exit 0 = passed).
# Adding a third solver means writing its manifest.json + build.sh - no
# Python coverage scripts, and no edits to this file. solver_dir defaults to
# src/solvers/<solver>, but can point inside your own solver checkout (e.g.
# myproject/cast-profile) so none of that needs to live in CAST at all -
# still just manifest.json + build.sh, never a coverage/ subdirectory.
#
# Runnable standalone - no other workflow file is required to trigger it:
#   - From the GitHub UI/API: Actions -> Coverage Mapper -> Run workflow
#   - From another workflow: uses: ./.github/workflows/coverage-mapper.yml (workflow_call)
#
# State (coverage-state, uploaded coverage mappings) is always namespaced by
# the calling repository (`github.repository`), same forced/top-level-prefix
# scheme as build.yml/manager.yml - see those files' headers for the full
# rationale. Oracle binaries (e.g. z3's cvc5 dependency) are never namespaced
# - they always come from the real upstream mechanism declared in the
# manifest, regardless of who's calling.
#
# solver/repo_url are required - deliberately no default, so no caller can
# silently inherit another solver's state under this workflow's own (forced)
# namespace.

on:
  workflow_call:
    inputs:
      solver:
        description: 'Solver name (must have a src/solvers/<solver>/manifest.json)'
        required: true
        type: string
      repo_url:
        description: 'Git URL of the upstream solver repository to build coverage for'
        required: true
        type: string
      commit_hash:
        description: 'Optional: commit hash to build coverage mapping for (defaults to HEAD)'
        required: false
        type: string
      test_count:
        description: 'Pre-counted test count (optional optimization, unused - carried over from the per-solver originals)'
        required: false
        type: number
      solver_dir:
        description: 'Directory containing manifest.json/build.sh for this solver (no coverage scripts - the engine is CAST-owned). Defaults to src/solvers/<solver> (CAST-maintained solvers); set to a path inside your own solver checkout (e.g. <solver>/cast-profile) to bring a new solver without adding anything to CAST itself'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      solver:
        description: 'Solver name (must have a src/solvers/<solver>/manifest.json)'
        required: true
        type: string
      repo_url:
        description: 'Git URL of the upstream solver repository to build coverage for'
        required: true
        type: string
      commit_hash:
        description: 'Optional: commit hash to build coverage mapping for (defaults to HEAD)'
        required: false
        type: string
      solver_dir:
        description: 'Directory containing manifest.json/build.sh for this solver (no coverage scripts - the engine is CAST-owned). Defaults to src/solvers/<solver> (CAST-maintained solvers); set to a path inside your own solver checkout (e.g. <solver>/cast-profile) to bring a new solver without adding anything to CAST itself'
        required: false
        type: string
        default: ''

jobs:
  discover-tests:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate-matrix.outputs.matrix }}
      total_tests: ${{ steps.generate-matrix.outputs.total_tests }}
      total_jobs: ${{ steps.generate-matrix.outputs.total_jobs }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Checkout solver repository and manifest-declared extra repos
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          if [ -d "$SOLVER" ]; then
            (cd "$SOLVER" && git fetch origin)
          else
            git clone "${{ inputs.repo_url }}" "$SOLVER"
          fi
          if [ -n "${{ inputs.commit_hash }}" ]; then
            (cd "$SOLVER" && git checkout "${{ inputs.commit_hash }}" && echo "Checked out commit: $(git rev-parse HEAD)")
          fi
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            dir=$(basename "$repo" .git)
            if [ -d "$dir" ]; then
              echo "$dir already exists, skipping clone"
            else
              git clone "$repo" "$dir"
            fi
          done < <(jq -r '.coverage.extra_repos[]' "$MANIFEST")

      - name: Run manifest-declared pre-discovery setup
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          PRE_SETUP=$(jq -r '.coverage.setup_command // empty' "$MANIFEST")
          if [ -n "$PRE_SETUP" ]; then
            (cd "$SOLVER" && eval "$PRE_SETUP")
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install psutil

      - name: Generate dynamic matrix
        id: generate-matrix
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi

          python3 "$GITHUB_WORKSPACE/src/coverage/generate_matrix.py" \
            --solver "$SOLVER" \
            --solver-dir "$SOLVER_DIR" \
            --max-job-time 360 \
            --buffer 60 \
            --output matrix.json

          MATRIX=$(jq -c '.matrix' matrix.json)
          TOTAL_TESTS=$(jq -r '.total_tests' matrix.json)
          TOTAL_JOBS=$(jq -r '.total_jobs' matrix.json)

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "total_tests=$TOTAL_TESTS" >> $GITHUB_OUTPUT
          echo "total_jobs=$TOTAL_JOBS" >> $GITHUB_OUTPUT

          echo "✅ Generated matrix with $TOTAL_JOBS jobs for $TOTAL_TESTS tests"
          cat matrix.json

  coverage-analysis:
    needs: discover-tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.discover-tests.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Checkout solver repository and manifest-declared extra repos
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          if [ -d "$SOLVER" ]; then
            (cd "$SOLVER" && git fetch origin)
          else
            git clone "${{ inputs.repo_url }}" "$SOLVER"
          fi
          if [ -n "${{ inputs.commit_hash }}" ]; then
            (cd "$SOLVER" && git checkout "${{ inputs.commit_hash }}" && echo "Checked out commit: $(git rev-parse HEAD)")
          fi
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            dir=$(basename "$repo" .git)
            if [ -d "$dir" ]; then
              echo "$dir already exists, skipping clone"
            else
              git clone "$repo" "$dir"
            fi
          done < <(jq -r '.coverage.extra_repos[]' "$MANIFEST")

      - name: Install manifest-declared oracle
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          ORACLE_SOLVER=$(jq -r '.coverage.oracle_solver // empty' "$MANIFEST")
          if [ -z "$ORACLE_SOLVER" ]; then
            echo "No oracle declared for $SOLVER, skipping"
            exit 0
          fi
          FETCH_TYPE=$(jq -r '.coverage.oracle_fetch.type' "$MANIFEST")
          if [ "$FETCH_TYPE" != "github_release" ]; then
            echo "❌ Unsupported coverage.oracle_fetch.type: $FETCH_TYPE"
            exit 1
          fi
          REPO=$(jq -r '.coverage.oracle_fetch.repo' "$MANIFEST")
          ASSET_KEYWORDS=$(jq -r '.coverage.oracle_fetch.asset_keywords | join(",")' "$MANIFEST")
          BINARY_NAME=$(jq -r '.coverage.oracle_fetch.binary_name' "$MANIFEST")
          INSTALL_DIR=$(jq -r '.coverage.oracle_fetch.install_dir' "$MANIFEST")
          INSTALL_DIR=$(eval echo "$INSTALL_DIR")
          pip install requests
          python3 "$GITHUB_WORKSPACE/src/util/download_github_release_binary.py" \
            --repo "$REPO" --asset-keywords "$ASSET_KEYWORDS" --binary-name "$BINARY_NAME" \
            "$INSTALL_DIR"
          echo "$INSTALL_DIR" >> $GITHUB_PATH
          "$ORACLE_SOLVER" --version
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build solver with coverage
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          "$SOLVER_DIR/build.sh" --coverage

      - name: Run coverage analysis (tests ${{ matrix.start_index }}-${{ matrix.end_index }})
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          "$GITHUB_WORKSPACE/src/util/measure_time.sh" "$GITHUB_WORKSPACE/src/coverage/run_coverage_builder.sh" "$SOLVER" "$SOLVER_DIR" ${{ matrix.start_index }} ${{ matrix.end_index }}

      - name: Upload coverage mapping
        uses: actions/upload-artifact@v4
        with:
          name: coverage-mapping-${{ matrix.job_name }}
          path: ${{ inputs.solver }}/build/coverage_mapping_${{ matrix.start_index }}_${{ matrix.end_index }}.json
          retention-days: 1

  # Join all coverage mappings and create final artifact
  join-mappings:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs: [discover-tests, coverage-analysis]
    outputs:
      commit_hash: ${{ steps.get-commit.outputs.commit_hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Get solver commit hash
        id: get-commit
        run: |
          SOLVER="${{ inputs.solver }}"
          if [ -n "${{ inputs.commit_hash }}" ]; then
            COMMIT_HASH="${{ inputs.commit_hash }}"
          else
            if [ ! -d "$SOLVER" ]; then
              git clone "${{ inputs.repo_url }}" "$SOLVER"
            fi
            (cd "$SOLVER" && git fetch origin)
            COMMIT_HASH=$(cd "$SOLVER" && git rev-parse HEAD)
          fi
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "$SOLVER commit hash: $COMMIT_HASH"

      - name: Clone solver repo early if solver_dir needs it
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          # "Get solver commit hash" above only clones when commit_hash isn't
          # already provided - fine when manifest/scripts live in CAST's own
          # src/solvers/, but a solver_dir pointing inside the solver's own
          # checkout needs that checkout to exist before it's read below.
          if [ -n "$SOLVER_DIR" ] && [ ! -d "$SOLVER" ]; then
            git clone "${{ inputs.repo_url }}" "$SOLVER"
          fi

      - name: Download all coverage mappings
        uses: actions/download-artifact@v4
        with:
          path: coverage-mappings

      - name: Join coverage mappings
        run: |
          # Fully solver-agnostic (just merges JSON files by directory walk) -
          # CAST-owned, not part of solver_dir's per-solver profile.
          python3 "$GITHUB_WORKSPACE/src/coverage/join_coverage_mappings.py"

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}
          r2_broker_function_url: 'https://e7gghvi6g5gw4gaszvu5wrou6i0annob.lambda-url.eu-north-1.on.aws/'  # see src/infra/r2-broker/README.md
          r2_broker_role_arn: 'arn:aws:iam::615930035042:role/service-role/cast-r2-broker-role-ro68mail'  # see src/infra/r2-broker/README.md
          r2_broker_region: 'eu-north-1'  # see src/infra/r2-broker/README.md

      - name: Prepare coverage mapping upload
        id: prepare-upload
        run: |
          NAMESPACE="${{ github.repository }}"
          COMMIT_HASH="${{ steps.get-commit.outputs.commit_hash }}"
          S3_KEY="$NAMESPACE/solvers/${{ inputs.solver }}/coverage-mappings/coverage_mapping-${COMMIT_HASH}.json.gz"

          if [ ! -f "coverage_mapping.json.gz" ]; then
            echo "❌ Error: coverage_mapping.json.gz not found"
            exit 1
          fi

          echo "s3_key=$S3_KEY" >> $GITHUB_OUTPUT
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

      - name: Upload final coverage mapping to S3
        uses: ./.github/actions/s3-put-object
        with:
          key: ${{ steps.prepare-upload.outputs.s3_key }}
          file: coverage_mapping.json.gz

  # Update coverage state after successful build
  update-state:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    needs: [discover-tests, join-mappings]
    if: success()

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install boto3
        run: pip install boto3 requests

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}
          r2_broker_function_url: 'https://e7gghvi6g5gw4gaszvu5wrou6i0annob.lambda-url.eu-north-1.on.aws/'  # see src/infra/r2-broker/README.md
          r2_broker_role_arn: 'arn:aws:iam::615930035042:role/service-role/cast-r2-broker-role-ro68mail'  # see src/infra/r2-broker/README.md
          r2_broker_region: 'eu-north-1'  # see src/infra/r2-broker/README.md

      - name: Update coverage state
        run: |
          NAMESPACE="${{ github.repository }}"
          python3 src/coverage/coverage_state.py ${{ inputs.solver }} --namespace "$NAMESPACE" update \
            --test-count ${{ needs.discover-tests.outputs.total_tests }} \
            --commit-hash ${{ needs.join-mappings.outputs.commit_hash }} \
            --updated-by "${{ github.workflow }}"

          echo "✅ Updated coverage state: ${{ needs.discover-tests.outputs.total_tests }} tests"
