name: Coverage Daily Check

# Reusable, solver-agnostic daily coverage-rebuild check.
#
# Generalizes cvc5-coverage-daily-check.yml and z3-coverage-daily-check.yml.
# Same manifest-driven approach as coverage-mapper.yml (see that file's
# header for the full rationale) - all solver-specific facts (extra repos to
# clone, setup command, how tests are listed) come from
# src/solvers/<solver>/manifest.json, not from branching in this file.
# solver_dir defaults to src/solvers/<solver> and, like coverage-mapper.yml,
# can point inside your own solver checkout instead; it's passed straight
# through to the coverage-mapper.yml call below.
#
# Runnable standalone:
#   - From the GitHub UI/API: Actions -> Coverage Daily Check -> Run workflow
#   - From another workflow: uses: ./.github/workflows/coverage-daily-check.yml (workflow_call)
#
# solver/repo_url are required - deliberately no default, so no caller can
# silently inherit another solver's state under this workflow's own (forced)
# namespace - see coverage-mapper.yml's header for the full rationale.

on:
  workflow_call:
    inputs:
      solver:
        description: 'Solver name (must have a src/solvers/<solver>/manifest.json)'
        required: true
        type: string
      repo_url:
        description: 'Git URL of the upstream solver repository to check'
        required: true
        type: string
      solver_dir:
        description: 'Directory containing manifest.json for this solver. Defaults to src/solvers/<solver> (CAST-maintained solvers); set to a path inside your own solver checkout (e.g. <solver>/cast-profile) to bring a new solver without adding anything to CAST itself'
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      solver:
        description: 'Solver name (must have a src/solvers/<solver>/manifest.json)'
        required: true
        type: string
      repo_url:
        description: 'Git URL of the upstream solver repository to check'
        required: true
        type: string
      solver_dir:
        description: 'Directory containing manifest.json for this solver. Defaults to src/solvers/<solver> (CAST-maintained solvers); set to a path inside your own solver checkout (e.g. <solver>/cast-profile) to bring a new solver without adding anything to CAST itself'
        required: false
        type: string
        default: ''

jobs:
  check-rebuild-needed:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      should_rebuild: ${{ steps.check-state.outputs.should_rebuild }}
      reason: ${{ steps.check-state.outputs.reason }}
      test_count: ${{ steps.count-tests.outputs.test_count }}
      commit_hash: ${{ steps.count-tests.outputs.commit_hash }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: feature/parametric-coverage-fuzzer
      - name: Checkout solver repository and manifest-declared extra repos
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          if [ -d "$SOLVER" ]; then
            (cd "$SOLVER" && git fetch origin)
          else
            git clone "${{ inputs.repo_url }}" "$SOLVER"
          fi
          while IFS= read -r repo; do
            [ -z "$repo" ] && continue
            dir=$(basename "$repo" .git)
            if [ -d "$dir" ]; then
              echo "$dir already exists, skipping clone"
            else
              git clone "$repo" "$dir"
            fi
          done < <(jq -r '.coverage.extra_repos[]' "$MANIFEST")

      - name: Run manifest-declared pre-discovery setup
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi
          MANIFEST="$SOLVER_DIR/manifest.json"
          PRE_SETUP=$(jq -r '.coverage.setup_command // empty' "$MANIFEST")
          if [ -n "$PRE_SETUP" ]; then
            (cd "$SOLVER" && eval "$PRE_SETUP")
          fi

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install boto3 psutil requests

      - name: Count tests
        id: count-tests
        run: |
          SOLVER="${{ inputs.solver }}"
          SOLVER_DIR="${{ inputs.solver_dir }}"
          if [ -z "$SOLVER_DIR" ]; then SOLVER_DIR="src/solvers/$SOLVER"; fi

          python3 src/coverage/count_tests.py \
            --solver "$SOLVER" \
            --solver-dir "$SOLVER_DIR" \
            --output test-count.json

          TEST_COUNT=$(jq -r '.test_count' test-count.json)
          COMMIT_HASH=$(jq -r '.commit_hash' test-count.json)

          echo "test_count=$TEST_COUNT" >> $GITHUB_OUTPUT
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT

          echo "✅ Found $TEST_COUNT tests at commit ${COMMIT_HASH:0:8}"

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}
          r2_broker_function_url: 'https://e7gghvi6g5gw4gaszvu5wrou6i0annob.lambda-url.eu-north-1.on.aws/'  # see src/infra/r2-broker/README.md
          r2_broker_role_arn: 'arn:aws:iam::615930035042:role/service-role/cast-r2-broker-role-ro68mail'  # see src/infra/r2-broker/README.md
          r2_broker_region: 'eu-north-1'  # see src/infra/r2-broker/README.md

      - name: Check if rebuild needed
        id: check-state
        run: |
          NAMESPACE="${{ github.repository }}"
          python3 src/coverage/coverage_state.py ${{ inputs.solver }} --namespace "$NAMESPACE" check \
            --test-count ${{ steps.count-tests.outputs.test_count }} \
            --output decision.json

          SHOULD_REBUILD=$(jq -r '.should_rebuild' decision.json)
          REASON=$(jq -r '.reason' decision.json)

          echo "should_rebuild=$SHOULD_REBUILD" >> $GITHUB_OUTPUT
          echo "reason=$REASON" >> $GITHUB_OUTPUT

          if [ "$SHOULD_REBUILD" = "true" ]; then
            echo "✅ Decision: REBUILD - $REASON"
          else
            echo "⏭️  Decision: SKIP - $REASON"
          fi

  trigger-coverage-build:
    needs: check-rebuild-needed
    if: needs.check-rebuild-needed.outputs.should_rebuild == 'true'
    uses: ./.github/workflows/coverage-mapper.yml
    with:
      solver: ${{ inputs.solver }}
      repo_url: ${{ inputs.repo_url }}
      commit_hash: ${{ needs.check-rebuild-needed.outputs.commit_hash }}
      test_count: ${{ fromJSON(needs.check-rebuild-needed.outputs.test_count) }}
      solver_dir: ${{ inputs.solver_dir }}
    secrets: inherit

  skip-build:
    needs: check-rebuild-needed
    if: needs.check-rebuild-needed.outputs.should_rebuild == 'false'
    runs-on: ubuntu-latest

    steps:
      - name: Log skip reason
        run: |
          echo "⏭️  Skipping coverage build"
          echo "Reason: ${{ needs.check-rebuild-needed.outputs.reason }}"
          echo "Test count: ${{ needs.check-rebuild-needed.outputs.test_count }}"
          echo "Commit: ${{ needs.check-rebuild-needed.outputs.commit_hash }}"
