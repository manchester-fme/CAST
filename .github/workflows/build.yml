name: Build Solver

# Reusable, solver-agnostic production build workflow.
#
# Polls the shared S3 build-queue/fuzzing-schedule state for a given solver
# (or builds one manually supplied commit), builds both a production and a
# coverage-instrumented static binary, uploads them, and clears the queue
# entry. It generalizes the logic duplicated between cvc5-build.yml and
# z3-build.yml behind a single set of parameters (solver, repo_url,
# build_script, binary_path, commit_hash).
#
# Runnable standalone - no other workflow file is required to trigger it:
#   - From the GitHub UI/API: Actions -> Build Solver -> Run workflow, or
#     `gh workflow run build.yml -f solver=cvc5 -f repo_url=... -f
#     build_script=./src/solvers/cvc5/build.sh -f binary_path=build/bin/cvc5`
#   - From another workflow: uses: ./.github/workflows/build.yml (workflow_call)
#
# Any solver works as long as build_script accepts --static / --static
# --coverage and produces a binary at binary_path - build_script can point
# anywhere, including inside a fork's own checkout (e.g.
# myproject/build.sh), so this repo never needs to contain anything
# solver-specific for a fork's own solver. Packaging the built artifacts
# (headers, binary, compile_commands.json) is handled generically by
# src/util/collect_build_artifacts.sh using binary_path alone - no
# per-solver script needed for that part at all.
#
# solver/repo_url/build_script/binary_path are required - deliberately no
# default, since state below is namespaced per solver and a silently-assumed
# solver would misattribute another caller's build state to it. Set
# force_run: true to build even when the queue is empty and no commit_hash
# is given - it resolves and queues the latest commit on repo_url instead of
# hitting skip-build.
#
# State (build-queue and uploaded artifacts) is always namespaced by the
# calling repository (`github.repository`, e.g. `manchester-fme/CAST` or
# `someuser/cvc5`) - not just for forks, for every caller, including CAST's
# own runs. There is no unnamespaced/"default" state and nothing to
# configure: `github.repository` comes from the Actions runtime itself, not
# a workflow input, so it can't be forgotten or spoofed. The namespace is the
# top-level prefix in the bucket (e.g.
# `manchester-fme/CAST/solvers/cvc5/builds/v2/production/...`), so every
# caller gets its own directory and a fork's state can never collide with
# another caller's - not whatever bare/unnamespaced path an older direct
# caller (e.g. cvc5-build.yml) might use.
#
# Calling from a fork is just:
#
#   jobs:
#     cast-build:
#       uses: manchester-fme/CAST/.github/workflows/build.yml@main
#       with:
#         solver: cvc5
#         repo_url: ${{ github.server_url }}/${{ github.repository }}
#       secrets: inherit
#
# Bringing a wholly new solver (not z3/cvc5) without adding anything to CAST:
#
#       with:
#         solver: myproject
#         repo_url: ${{ github.server_url }}/${{ github.repository }}
#         build_script: myproject/build.sh   # lives inside the fork's own checkout
#         binary_path: build/myproject
#       secrets: inherit

on:
  workflow_call:
    inputs:
      solver:
        description: 'Solver name (namespaces the build queue, S3 keys, and src/solvers/<solver> scripts); leave empty to default to this repo''s own name (github.event.repository.name)'
        required: false
        type: string
        default: ''
      repo_url:
        description: 'Git URL of the upstream solver repository to build; leave empty to derive it from fuzzer.repo_url in .cast/manifest.json'
        required: false
        type: string
        default: ''
      build_script:
        description: 'Path to the solver build script; leave empty to default to <solver>/.cast/build.sh'
        required: false
        type: string
        default: ''
      binary_path:
        description: 'Path to the built binary, relative to the solver checkout (e.g. build/bin/cvc5); leave empty to derive it from fuzzer.target_binary_path in .cast/manifest.json'
        required: false
        type: string
        default: ''
      commit_hash:
        description: 'Optional: commit hash to add to the build queue'
        required: false
        type: string
      force_run:
        description: 'Force a build even if the queue is empty and no commit_hash is given (builds the latest commit on repo_url instead of skipping)'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      solver:
        description: 'Solver name (namespaces the build queue, S3 keys, and src/solvers/<solver> scripts); leave empty to default to this repo''s own name (github.event.repository.name)'
        required: false
        type: string
        default: ''
      repo_url:
        description: 'Git URL of the upstream solver repository to build; leave empty to derive it from fuzzer.repo_url in .cast/manifest.json'
        required: false
        type: string
        default: ''
      build_script:
        description: 'Path to the solver build script; leave empty to default to <solver>/.cast/build.sh'
        required: false
        type: string
        default: ''
      binary_path:
        description: 'Path to the built binary, relative to the solver checkout (e.g. build/bin/cvc5); leave empty to derive it from fuzzer.target_binary_path in .cast/manifest.json'
        required: false
        type: string
        default: ''
      commit_hash:
        description: 'Optional: commit hash to add to the build queue'
        required: false
        type: string
      force_run:
        description: 'Force a build even if the queue is empty and no commit_hash is given (builds the latest commit on repo_url instead of skipping)'
        required: false
        type: boolean
        default: false

jobs:
  check-build-queue:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    outputs:
      build_needed: ${{ steps.set-outputs.outputs.build_needed }}
      sha: ${{ steps.set-outputs.outputs.sha }}
      is_manual_build: ${{ steps.set-outputs.outputs.is_manual_build }}
      resolved_repo_url: ${{ steps.resolve-repo-url.outputs.repo_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3 requests

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}

      - name: Resolve repo_url from manifest.json if not provided
        id: resolve-repo-url
        uses: ./.github/actions/resolve-repo-url
        with:
          repo_url: ${{ inputs.repo_url }}

      - name: Check build queue or add manual commit
        id: set-outputs
        run: |
          SOLVER="${{ inputs.solver || github.event.repository.name }}"
          NAMESPACE="${{ github.repository }}"
          NAMESPACE_ARGS=(--namespace "$NAMESPACE")
          if [ -n "${{ inputs.commit_hash }}" ]; then
            COMMIT_HASH="${{ inputs.commit_hash }}"
            echo "🔨 Adding provided commit to build queue: $COMMIT_HASH"
            python src/scheduling/s3_state.py "$SOLVER" "${NAMESPACE_ARGS[@]}" build-queue add "$COMMIT_HASH"
            echo "build_needed=true" >> $GITHUB_OUTPUT
            echo "sha=$COMMIT_HASH" >> $GITHUB_OUTPUT
            echo "is_manual_build=true" >> $GITHUB_OUTPUT
          else
            COMMIT_HASH=$(python src/scheduling/builder.py "$SOLVER" "${NAMESPACE_ARGS[@]}")
            if [ -z "$COMMIT_HASH" ] && [ "${{ inputs.force_run }}" = "true" ]; then
              echo "⚡ Queue empty but force_run is set - resolving latest commit on ${{ steps.resolve-repo-url.outputs.repo_url }}"
              COMMIT_HASH=$(git ls-remote "${{ steps.resolve-repo-url.outputs.repo_url }}" HEAD | cut -f1)
              if [ -z "$COMMIT_HASH" ]; then
                echo "❌ Could not resolve HEAD commit for ${{ steps.resolve-repo-url.outputs.repo_url }}"
                exit 1
              fi
              echo "🔨 Forcing build of $COMMIT_HASH"
              python src/scheduling/s3_state.py "$SOLVER" "${NAMESPACE_ARGS[@]}" build-queue add "$COMMIT_HASH"
            fi
            if [ -n "$COMMIT_HASH" ]; then
              echo "build_needed=true" >> $GITHUB_OUTPUT
              echo "sha=$COMMIT_HASH" >> $GITHUB_OUTPUT
              echo "is_manual_build=false" >> $GITHUB_OUTPUT
            else
              echo "build_needed=false" >> $GITHUB_OUTPUT
              echo "sha=" >> $GITHUB_OUTPUT
              echo "is_manual_build=false" >> $GITHUB_OUTPUT
            fi
          fi

  build-static:
    needs: check-build-queue
    if: needs.check-build-queue.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Clean stale checkout
        run: rm -rf "${{ inputs.solver || github.event.repository.name }}"
      - uses: ./.github/actions/clone-solver-source
        with:
          solver: ${{ inputs.solver || github.event.repository.name }}
          repo_url: ${{ needs.check-build-queue.outputs.resolved_repo_url }}
      - name: Resolve binary_path from manifest.json if not provided
        id: resolve-binary-path
        run: |
          BINARY_PATH="${{ inputs.binary_path }}"
          if [ -z "$BINARY_PATH" ]; then
            SOLVER="${{ inputs.solver || github.event.repository.name }}"
            BINARY_PATH=$(jq -r '.fuzzer.target_binary_path // empty' "$SOLVER/.cast/manifest.json" | sed 's#^\./##')
            if [ -z "$BINARY_PATH" ]; then
              echo "::error::binary_path not provided and no fuzzer.target_binary_path found in .cast/manifest.json"
              exit 1
            fi
            echo "Derived binary_path from manifest.json: $BINARY_PATH"
          fi
          echo "binary_path=$BINARY_PATH" >> "$GITHUB_OUTPUT"
      - name: Checkout commit
        run: |
          SOLVER="${{ inputs.solver || github.event.repository.name }}"
          COMMIT_HASH="${{ needs.check-build-queue.outputs.sha }}"
          echo "🔨 Building commit: $COMMIT_HASH"
          cd "$SOLVER"
          git checkout "$COMMIT_HASH"
          echo "Checked out commit: $(git rev-parse HEAD)"

      - name: Build ${{ inputs.solver || github.event.repository.name }} static binary
        run: ${{ inputs.build_script || format('{0}/.cast/build.sh', inputs.solver || github.event.repository.name) }} --static

      - name: Get commit hash
        id: get-commit
        working-directory: ${{ inputs.solver || github.event.repository.name }}
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "${{ inputs.solver || github.event.repository.name }} commit hash: $COMMIT_HASH"

      - name: Measure binary size
        working-directory: ${{ inputs.solver || github.event.repository.name }}
        run: |
          BIN_PATH="${{ steps.resolve-binary-path.outputs.binary_path }}"
          if [ -f "$BIN_PATH" ]; then
            BINARY_SIZE=$(du -h "$BIN_PATH" | cut -f1)
            BINARY_SIZE_BYTES=$(stat -f%z "$BIN_PATH" 2>/dev/null || stat -c%s "$BIN_PATH" 2>/dev/null)
            echo "Binary size: $BINARY_SIZE ($BINARY_SIZE_BYTES bytes)"
            echo "binary_size=$BINARY_SIZE" >> $GITHUB_OUTPUT
            echo "binary_size_bytes=$BINARY_SIZE_BYTES" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Binary not found at $BIN_PATH"
            exit 1
          fi

      - name: Collect build artifacts (headers, binary, compile_commands)
        run: |
          SOLVER="${{ inputs.solver || github.event.repository.name }}"
          # binary_path is relative to $SOLVER/ (e.g. "build/bin/cvc5"); strip
          # the leading "build/" to get the build-dir-relative path collect_build_artifacts.sh needs.
          BINARY_RELPATH=$(echo "${{ steps.resolve-binary-path.outputs.binary_path }}" | sed 's#^build/##')
          "$GITHUB_WORKSPACE/src/util/collect_build_artifacts.sh" "$SOLVER/build" .artifacts "$BINARY_RELPATH"

      - name: Compress collected artifacts
        run: |
          cd .artifacts
          tar -czf ../${{ inputs.solver || github.event.repository.name }}/build/artifacts.tar.gz .
          cd ..
          COMPRESSED_SIZE=$(du -h ${{ inputs.solver || github.event.repository.name }}/build/artifacts.tar.gz | cut -f1)
          echo "Compressed size: $COMPRESSED_SIZE"

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}

      - name: Check if commit is still in build queue
        id: check-queue
        run: |
          SOLVER="${{ inputs.solver || github.event.repository.name }}"
          NAMESPACE="${{ github.repository }}"
          NAMESPACE_ARGS=(--namespace "$NAMESPACE")
          COMMIT_HASH="${{ steps.get-commit.outputs.commit_hash }}"
          # Capture both stdout and stderr, but extract only "true" or "false" from stdout
          CHECK_OUTPUT=$(python src/scheduling/s3_state.py "$SOLVER" "${NAMESPACE_ARGS[@]}" build-queue check "$COMMIT_HASH" 2>&1)
          IN_QUEUE=$(echo "$CHECK_OUTPUT" | grep -E "^(true|false)$" | tail -1)
          if [ "$IN_QUEUE" = "true" ]; then
            echo "✅ Commit $COMMIT_HASH is still in build queue, will upload"
            echo "should_upload=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Commit $COMMIT_HASH was removed from queue, discarding build"
            echo "DEBUG: Check output: $CHECK_OUTPUT"
            echo "should_upload=false" >> $GITHUB_OUTPUT
          fi

      - name: Compute S3 upload key
        id: upload-key
        run: |
          NAMESPACE="${{ github.repository }}"
          echo "key=$NAMESPACE/solvers/${{ inputs.solver || github.event.repository.name }}/builds/v2/production/${{ steps.get-commit.outputs.commit_hash }}.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload production binary to S3
        if: steps.check-queue.outputs.should_upload == 'true'
        uses: ./.github/actions/s3-put-object
        with:
          key: ${{ steps.upload-key.outputs.key }}
          file: ${{ inputs.solver || github.event.repository.name }}/build/artifacts.tar.gz

      - name: Discard build (not in queue)
        if: steps.check-queue.outputs.should_upload == 'false'
        run: |
          echo "⚠️  Build discarded - commit was removed from queue"

  build-static-coverage:
    needs: check-build-queue
    if: needs.check-build-queue.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Install LLVM/Clang 17
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '17'

      - name: Add LLVM to PATH
        run: echo "${{ env.LLVM_PATH }}/bin" >> $GITHUB_PATH

      - name: Clean any previous build
        run: |
          if [ -d "${{ inputs.solver || github.event.repository.name }}/build" ]; then
            rm -rf ${{ inputs.solver || github.event.repository.name }}/build
            echo "Cleaned previous build directory"
          fi

      - name: Clean stale checkout
        run: rm -rf "${{ inputs.solver || github.event.repository.name }}"
      - uses: ./.github/actions/clone-solver-source
        with:
          solver: ${{ inputs.solver || github.event.repository.name }}
          repo_url: ${{ needs.check-build-queue.outputs.resolved_repo_url }}
      - name: Resolve binary_path from manifest.json if not provided
        id: resolve-binary-path
        run: |
          BINARY_PATH="${{ inputs.binary_path }}"
          if [ -z "$BINARY_PATH" ]; then
            SOLVER="${{ inputs.solver || github.event.repository.name }}"
            BINARY_PATH=$(jq -r '.fuzzer.target_binary_path // empty' "$SOLVER/.cast/manifest.json" | sed 's#^\./##')
            if [ -z "$BINARY_PATH" ]; then
              echo "::error::binary_path not provided and no fuzzer.target_binary_path found in .cast/manifest.json"
              exit 1
            fi
            echo "Derived binary_path from manifest.json: $BINARY_PATH"
          fi
          echo "binary_path=$BINARY_PATH" >> "$GITHUB_OUTPUT"
      - name: Checkout commit
        run: |
          SOLVER="${{ inputs.solver || github.event.repository.name }}"
          COMMIT_HASH="${{ needs.check-build-queue.outputs.sha }}"
          echo "🔨 Building commit: $COMMIT_HASH"
          cd "$SOLVER"
          git checkout "$COMMIT_HASH"
          echo "Checked out commit: $(git rev-parse HEAD)"

      - name: Build ${{ inputs.solver || github.event.repository.name }} static binary with coverage
        run: |
          # Use clang with GCC toolchain to generate clang-compatible compile_commands.json
          # while still producing GCC-format coverage data (needed for fastcov)
          export CXX="clang++ --gcc-toolchain=/usr"
          export CC="clang --gcc-toolchain=/usr"
          ${{ inputs.build_script || format('{0}/.cast/build.sh', inputs.solver || github.event.repository.name) }} --static --coverage

      - name: Get commit hash
        id: get-commit
        working-directory: ${{ inputs.solver || github.event.repository.name }}
        run: |
          COMMIT_HASH=$(git rev-parse HEAD)
          echo "commit_hash=$COMMIT_HASH" >> $GITHUB_OUTPUT
          echo "${{ inputs.solver || github.event.repository.name }} commit hash: $COMMIT_HASH"

      - name: Measure binary size
        working-directory: ${{ inputs.solver || github.event.repository.name }}
        run: |
          BIN_PATH="${{ steps.resolve-binary-path.outputs.binary_path }}"
          if [ -f "$BIN_PATH" ]; then
            BINARY_SIZE=$(du -h "$BIN_PATH" | cut -f1)
            BINARY_SIZE_BYTES=$(stat -f%z "$BIN_PATH" 2>/dev/null || stat -c%s "$BIN_PATH" 2>/dev/null)
            echo "Binary size: $BINARY_SIZE ($BINARY_SIZE_BYTES bytes)"
            echo "binary_size=$BINARY_SIZE" >> $GITHUB_OUTPUT
            echo "binary_size_bytes=$BINARY_SIZE_BYTES" >> $GITHUB_OUTPUT
          else
            echo "ERROR: Binary not found at $BIN_PATH"
            exit 1
          fi

      - name: Collect build artifacts (headers, binary, compile_commands)
        run: |
          SOLVER="${{ inputs.solver || github.event.repository.name }}"
          # binary_path is relative to $SOLVER/ (e.g. "build/bin/cvc5"); strip
          # the leading "build/" to get the build-dir-relative path collect_build_artifacts.sh needs.
          BINARY_RELPATH=$(echo "${{ steps.resolve-binary-path.outputs.binary_path }}" | sed 's#^build/##')
          "$GITHUB_WORKSPACE/src/util/collect_build_artifacts.sh" "$SOLVER/build" .artifacts "$BINARY_RELPATH"

      - name: Compress collected artifacts
        run: |
          cd .artifacts
          tar -czf ../${{ inputs.solver || github.event.repository.name }}/build/artifacts.tar.gz .
          cd ..
          COMPRESSED_SIZE=$(du -h ${{ inputs.solver || github.event.repository.name }}/build/artifacts.tar.gz | cut -f1)
          echo "Compressed size: $COMPRESSED_SIZE"

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}

      - name: Check if commit is still in build queue (coverage)
        id: check-queue-coverage
        run: |
          SOLVER="${{ inputs.solver || github.event.repository.name }}"
          NAMESPACE="${{ github.repository }}"
          NAMESPACE_ARGS=(--namespace "$NAMESPACE")
          COMMIT_HASH="${{ steps.get-commit.outputs.commit_hash }}"
          IN_QUEUE=$(python src/scheduling/s3_state.py "$SOLVER" "${NAMESPACE_ARGS[@]}" build-queue check "$COMMIT_HASH" 2>&1 | tail -1)
          if [ "$IN_QUEUE" = "true" ]; then
            echo "✅ Commit $COMMIT_HASH is still in build queue, will upload"
            echo "should_upload=true" >> $GITHUB_OUTPUT
          else
            echo "⚠️  Commit $COMMIT_HASH was removed from queue, discarding build"
            echo "should_upload=false" >> $GITHUB_OUTPUT
          fi

      - name: Compute S3 upload key (coverage)
        id: upload-key-coverage
        run: |
          NAMESPACE="${{ github.repository }}"
          echo "key=$NAMESPACE/solvers/${{ inputs.solver || github.event.repository.name }}/builds/v2/coverage/${{ steps.get-commit.outputs.commit_hash }}.tar.gz" >> $GITHUB_OUTPUT

      - name: Upload coverage binary to S3
        if: steps.check-queue-coverage.outputs.should_upload == 'true'
        uses: ./.github/actions/s3-put-object
        with:
          key: ${{ steps.upload-key-coverage.outputs.key }}
          file: ${{ inputs.solver || github.event.repository.name }}/build/artifacts.tar.gz

      - name: Discard coverage build (not in queue)
        if: steps.check-queue-coverage.outputs.should_upload == 'false'
        run: |
          echo "⚠️  Coverage build discarded - commit was removed from queue"

  remove-from-queue:
    needs: [check-build-queue, build-static, build-static-coverage]
    if: |
      needs.build-static.result == 'success' &&
      needs.build-static-coverage.result == 'success' &&
      needs.check-build-queue.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3 requests

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}

      - name: Remove commit from build queue
        run: |
          NAMESPACE="${{ github.repository }}"
          NAMESPACE_ARGS=(--namespace "$NAMESPACE")
          COMMIT_HASH="${{ needs.check-build-queue.outputs.sha }}"
          python src/scheduling/s3_state.py ${{ inputs.solver || github.event.repository.name }} "${NAMESPACE_ARGS[@]}" build-queue remove "$COMMIT_HASH"
          echo "✅ Removed $COMMIT_HASH from build queue (both binaries uploaded)"

  remove-from-queue-on-failure:
    needs: [check-build-queue, build-static, build-static-coverage]
    if: |
      always() &&
      needs.check-build-queue.outputs.build_needed == 'true' &&
      (needs.build-static.result == 'failure' || needs.build-static-coverage.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          repository: manchester-fme/CAST
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install boto3 requests

      - name: Configure storage backend
        uses: ./.github/actions/configure-storage
        with:
          secrets: ${{ toJSON(secrets) }}
          storage_provider: ${{ vars.AWS_STORAGE_PROVIDER }}

      - name: Remove failed commit from build queue
        run: |
          NAMESPACE="${{ github.repository }}"
          NAMESPACE_ARGS=(--namespace "$NAMESPACE")
          COMMIT_HASH="${{ needs.check-build-queue.outputs.sha }}"
          echo "❌ Build failed for commit $COMMIT_HASH, removing from queue to prevent infinite retries"
          python src/scheduling/s3_state.py ${{ inputs.solver || github.event.repository.name }} "${NAMESPACE_ARGS[@]}" build-queue remove "$COMMIT_HASH"
          echo "✅ Removed failed commit $COMMIT_HASH from build queue"

  skip-build:
    needs: check-build-queue
    if: needs.check-build-queue.outputs.build_needed == 'false'
    runs-on: ubuntu-latest
    steps:
      - name: Skip build (no commits in queue)
        run: echo "✅ No commits in build queue - skipping build"
