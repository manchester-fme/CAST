name: S3 put-object
description: Uploads a file to the configured S3/R2/r2-broker backend
inputs:
  key:
    description: 'Destination object key within the bucket. For r2-broker, must start with "<owner>/<repo>/"'
    required: true
  file:
    description: 'Path to the local file to upload'
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        KEY="${{ inputs.key }}"
        if [ "${AWS_STORAGE_PROVIDER:-}" = "r2-broker" ]; then
          NAMESPACE=$(echo "$KEY" | cut -d'/' -f1-2)
          "$GITHUB_WORKSPACE/src/util/r2_broker_cli.sh" put "$NAMESPACE" "$KEY" "${{ inputs.file }}"
          echo "✅ Uploaded ${{ inputs.file }} to r2-broker key $KEY"
        else
          aws s3api put-object \
            --bucket "$AWS_BUCKET_NAME" \
            --key "$KEY" \
            --body "${{ inputs.file }}"
          echo "✅ Uploaded ${{ inputs.file }} to s3://$AWS_BUCKET_NAME/$KEY"
        fi
