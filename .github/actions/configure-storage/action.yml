name: Configure storage backend
description: Resolves the object storage backend and exports its settings into GITHUB_ENV
inputs:
  secrets:
    description: 'Pass toJSON(secrets) from the caller'
    required: true
  storage_provider:
    description: 'Optional: pass vars.AWS_STORAGE_PROVIDER from the caller to force "r2", "aws", or "r2-broker". Leave unset to auto-detect from whether AWS_ACCESS_KEY_ID is present in secrets.'
    required: false
  r2_broker_function_url:
    description: 'r2-broker only: the broker Lambda Function URL. Not a secret - defaulted here as the single source of truth (see src/infra/r2-broker/README.md); override only for a different broker deployment.'
    required: false
    default: 'https://e7gghvi6g5gw4gaszvu5wrou6i0annob.lambda-url.eu-north-1.on.aws/'
  r2_broker_role_arn:
    description: 'r2-broker only: IAM role ARN to assume via OIDC. Not a secret - defaulted here as the single source of truth (see src/infra/r2-broker/README.md); override only for a different broker deployment.'
    required: false
    default: 'arn:aws:iam::615930035042:role/service-role/cast-r2-broker-role-ro68mail'
  r2_broker_region:
    description: 'r2-broker only: AWS region the broker Lambda is deployed in. Not a secret - defaulted here as the single source of truth (see src/infra/r2-broker/README.md); override only for a different broker deployment. Must match the actual Lambda region or SigV4 signing fails with a 403.'
    required: false
    default: 'eu-north-1'
runs:
  using: composite
  steps:
    - shell: bash
      env:
        ALL_SECRETS: ${{ inputs.secrets }}
        AWS_STORAGE_PROVIDER: ${{ inputs.storage_provider }}
        R2_BROKER_FUNCTION_URL: ${{ inputs.r2_broker_function_url }}
        R2_BROKER_ROLE_ARN: ${{ inputs.r2_broker_role_arn }}
        R2_BROKER_REGION: ${{ inputs.r2_broker_region }}
      run: |
        for k in AWS_BUCKET_NAME AWS_ACCOUNT_ID AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION; do
          export "$k=$(jq -r --arg k "$k" '.[$k] // ""' <<<"$ALL_SECRETS")"
        done
        ./src/util/configure_storage.sh >> "$GITHUB_ENV"
