name: Build Solver (CAST)

# Single shared caller template: copy this exact file, unmodified, into
# .github/workflows/ of both your cvc5 fork and your Z3 fork. It detects
# which solver to build from the repository name (must contain "cvc5" or
# "z3" - true for a normal, unrenamed fork).
#
# See .github/fork-templates/README.md in manchester-fme/CAST for setup
# (required repo secrets, etc).

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Commit SHA, branch, or tag to build (defaults to the ref that triggered this run)'
        required: false
        type: string
      coverage:
        description: 'Also produce a coverage-instrumented build'
        required: false
        type: boolean
        default: false
  # Uncomment to build automatically on every push:
  # push:
  #   branches: [main]

jobs:
  detect-solver:
    runs-on: ubuntu-latest
    outputs:
      solver: ${{ steps.detect.outputs.solver }}
    steps:
      - name: Detect solver from repository name
        id: detect
        run: |
          REPO_NAME="${{ github.repository }}"
          if [[ "$REPO_NAME" == *cvc5* ]]; then
            echo "solver=cvc5" >> $GITHUB_OUTPUT
          elif [[ "$REPO_NAME" == *z3* ]]; then
            echo "solver=z3" >> $GITHUB_OUTPUT
          else
            echo "❌ Could not detect solver from repository name '$REPO_NAME'." >&2
            echo "   Rename the repo to contain 'cvc5' or 'z3', or call" >&2
            echo "   build-solver-fork.yml directly with an explicit 'solver' input." >&2
            exit 1
          fi

  build:
    needs: detect-solver
    uses: manchester-fme/CAST/.github/workflows/build-solver-fork.yml@main
    with:
      solver: ${{ needs.detect-solver.outputs.solver }}
      repo_url: ${{ github.server_url }}/${{ github.repository }}
      ref: ${{ inputs.ref || github.sha }}
      coverage: ${{ inputs.coverage || false }}
    secrets: inherit
